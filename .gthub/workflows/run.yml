name: Dual Strategy Scanner

on:
  schedule:
    - cron: '30 3 * * 1-5' # 9:00 AM IST (Pre-market & Daily Levels)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas yfinance nselib reportlab

      - name: Run Scanner
        run: |
          python main.py

      # ബോട്ട് റൺ കഴിഞ്ഞാലോ ഇടയ്ക്ക് വെച്ച് കട്ട് ആയാലോ ഡാറ്റ നഷ്ടപ്പെടാതെ സേവ് ചെയ്യുന്ന സ്റ്റെപ്പ്:
      - name: Auto Save Ledger to GitHub
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add expiry_trades_ledger.json daily_active_trades.json || true
          git commit -m "Auto-save ledger state [skip ci]" || echo "No changes to commit"
          git push
