name: Dual Strategy Scanner

on:
  schedule:
    - cron: '45 3 * * 1-5'  # 9:15 AM IST
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas numpy yfinance nselib reportlab

      - name: Run Scanner
        run: |
          python main.py
