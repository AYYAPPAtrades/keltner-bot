name: SAS Level Tracker Pro Bot

on:
  schedule:
    - cron: '0-59/5 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance reportlab

      - name: Run Pro Trading Bot
        run: |
          python strategy_bot_pro.py
