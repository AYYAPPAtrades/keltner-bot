name: SAS LEVEL TRACKER Bot

on:
  schedule:
    - cron: '45 3 * * 1-5'  # Mon-Fri at 03:45 AM UTC (09:15 AM IST)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy yfinance pytz reportlab

      - name: Run Scalping Bot
        run: python scalper.py
