
        name: Dual Strategy Scanner

on:
  schedule:
    - cron: '45 3 * * 1-5' # 9:15 AM IST
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scanner with Auto-Recovery
        id: bot_run
        run: |
          MAX_RETRIES=3
          COUNT=0
          until python main.py; do
            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "Bot failed after $MAX_RETRIES attempts."
              exit 1
            fi
            echo "Bot crashed, retrying..."
            curl -s -X POST "https://api.telegram.org/bot8921879577:AAHR_GPiDLyTtsrtMZx12CJ2nCM-YAUh3N0/sendMessage" \
              -d "chat_id=6789591588" \
              -d "text=WARNING: Scanner disconnected! Retrying attempt $COUNT of $MAX_RETRIES..."
            sleep 15
            curl -s -X POST "https://api.telegram.org/bot8921879577:AAHR_GPiDLyTtsrtMZx12CJ2nCM-YAUh3N0/sendMessage" \
              -d "chat_id=6789591588" \
              -d "text=RECOVERY SUCCESS: Bot reconnected and resumed scanning!"
          done

      - name: Send Final Failure Alert
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot8921879577:AAHR_GPiDLyTtsrtMZx12CJ2nCM-YAUh3N0/sendMessage" \
              -d "chat_id=6789591588" \
              -d "text=CRITICAL ALERT: Scanner has completely STOPPED after retries. Check manually!"

