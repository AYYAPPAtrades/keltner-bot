name: SAS LEVEL TRACKER Service

on:
  schedule:
    # Runs Monday to Friday at 8:58 AM IST (3:28 AM UTC)
    - cron: '28 3 * * 1-5'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Angel One Live Tracker Engine
        run: |
          python main.py
